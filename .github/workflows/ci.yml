name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit-and-golden:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/vwe/downloads
          key: verification-cbmc-6.11.0-esbmc-8.7-linux-amd64
      - name: Install pinned verification tools
        env:
          PREFIX: ${{ runner.temp }}/vwe-tools
          VWE_SKIP_PYTHON_INSTALL: '1'
        run: |
          bash tools/install_tools.sh
          echo "$PREFIX/cbmc/usr/bin" >> "$GITHUB_PATH"
          echo "$PREFIX/esbmc/release/bin" >> "$GITHUB_PATH"
      - name: Create isolated environment and install
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e .
      - name: Run tests including installed-tool golden checks
        run: make test
      - name: Record golden evidence
        run: make golden
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-python-${{ matrix.python-version }}
          path: runs/golden
          if-no-files-found: warn

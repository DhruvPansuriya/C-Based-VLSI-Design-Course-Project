# Benchmark P_ref-check profile: default bounds with 120 s solver timeouts.
[bounds]
K = 4
max_unwind = 9

[timeouts]
cbmc_s = 120
esbmc_s = 120
equiv_pair_s = 120

[backends]
primary = ["sat", "z3"]
confirm = "esbmc"

[native]
cc = "gcc"
sanitize = "address,undefined"
prepass_samples = 10000
seed = 0
prepass_seconds = 2


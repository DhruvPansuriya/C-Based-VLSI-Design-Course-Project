[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "vwe"
version = "0.1.0"
description = "Verdicts with Evidence: selective verification of C repairs"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.scripts]
vwe = "vwe.cli:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["vwe", "vwe.*"]

[tool.setuptools.data-files]
"share/vwe/config" = ["config/default.toml", "config/whitelist.toml", "config/llm.toml"]
"share/vwe/schemas" = ["schemas/task.schema.json", "schemas/interpretation.schema.json", "schemas/interpretation_set.schema.json", "schemas/verdict_report.schema.json", "schemas/request_typing.schema.json", "schemas/shape_proposal.schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires installed verification tools"]

[tool.setuptools.package-data]
"vwe.llm" = ["prompts/*.md"]
"vwe.contract" = ["grammar.lark"]
